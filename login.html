<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de login - Conmebol Libertadores</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    
    <main class="container" style="max-width: 420px;">
        <div class="card p-4 shadow">
            <div class="text-center mb-3">
                <img src="Imagens/conmebol-libertadores4840.jpg" alt="Logotipo CONMEBOL Libertadores" class="img-fluid mb-2" style="max-height: 70px;">
                <h1 class="h4 fw-bold titulo-seccao">Área de Acesso</h1>
            </div>
            <form action="index.html">
                <div class="mb-3">
                    <label for="emailUsuario" class="form-label fw-bold">E-mail</label>
                    <input type="email" class="form-control" id="emailUsuario" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="senhaUsuario" class="form-label fw-bold">Senha</label>
                    <input type="password" class="form-control" id="senhaUsuario" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold mb-3">Entrar</button>
            </form>
            <div class="text-center">
                <a href="index.html" class="text-decoration-none">← Voltar para a página principal</a>
            </div>
        </div>
    </main>
</body>
</html>
